<a th:href="|/projects/${issue.project.key}/issues|">Назад</a>

<form method="post" autocomplete="off" style="display: flex">
    <span th:text="${issue.key}"></span>
    <input name="summary" th:value="${issue.summary}" style="flex: 1">
    <select name="status">
        <option th:each="status : ${statuses}"
                th:value="${status}"
                th:text="${status.displayName}"
                th:selected="${status == issue.status}">
    </select>
    <button>Сохранить</button>
</form>
