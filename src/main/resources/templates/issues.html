<form method="post">
    <input name="issue">
    <button>Создать задачу</button>
</form>

<table>
    <thead>
    <tr>
        <th>Задачи</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="issue : ${issues}">
        <td th:text="|${projectKey}-${issue.number} ${issue.summary}|">
        <td th:text="${issue.status.displayName}">
    </tr>
    </tbody>
</table>
