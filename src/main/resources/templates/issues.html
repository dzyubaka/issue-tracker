<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|Задачи проекта ${project.name}|"></title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
</head>
<body class="m-3">
<a href="/projects" class="btn btn-primary">Назад</a>

<div class="d-flex justify-content-between align-items-center">
    <h1 th:text="|Задачи проекта ${project.name}|"></h1>

    <a th:href="|/projects/${projectKey}/issues/new|" class="btn btn-primary">Создать задачу</a>
</div>

<table class="table">
    <thead>
    <tr>
        <th>Задачи</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="issue : ${issues}">
        <td>
            <a th:text="${issue.key}" th:href="|/projects/${projectKey}/issues/${issue.key}|"></a>
            <span th:text="${issue.summary}"></span>
        </td>
        <td th:text="${issue.status.displayName}">
    </tr>
    </tbody>
</table>
</body>
</html>
