<style>
    th, td {
        border: 1px solid black;
    }
</style>

<a href="/projects">Назад</a>

<form method="post" autocomplete="off">
    <label for="summary">Тема</label>
    <input name="summary" id="summary">
    <br>
    <label for="description">Описание</label>
    <textarea name="description" id="description"></textarea>
    <br>
    <button>Создать задачу</button>
</form>

<table style="border-collapse: collapse">
    <thead>
    <tr>
        <th>Задачи</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="issue : ${issues}">
        <td>
            <a th:text="${issue.key}" th:href="|/projects/${projectKey}/issues/${issue.key}|"></a>
            <span th:text="${issue.summary}"></span>
        </td>
        <td th:text="${issue.status.displayName}">
    </tr>
    </tbody>
</table>
