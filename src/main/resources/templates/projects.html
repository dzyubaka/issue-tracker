<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Проекты</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
</head>
<body class="m-3">
<div class="d-flex justify-content-between align-items-center">
    <h1>Проекты</h1>
    <a href="/projects/new" class="btn btn-primary">Создать проект</a>
</div>

<ul class="list-group">
    <li th:each="project : ${projects}" class="list-group-item">
        <a th:text="${project.name}" th:href="|/projects/${project.key}|"></a>
    </li>
</ul>
</body>
</html>
