<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:data-bs-theme="${session.theme}">
<head>
    <meta charset="UTF-8">
    <title>Создать проект</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
</head>
<body class="m-3">
<form th:action="@{/projects}" method="post" autocomplete="off" class="form-group">
    <div class="d-flex justify-content-between align-items-center">
        <a href="/projects" class="btn btn-primary">Назад</a>
        <h1>Создать проект</h1>
        <button class="btn btn-primary">Создать проект</button>
    </div>
    <label for="key">Ключ</label>
    <input name="key" id="key" placeholder="Ключ" class="form-control">
    <label for="name">Название</label>
    <input name="name" id="name" placeholder="Название" class="form-control">
</form>
</body>
</html>
